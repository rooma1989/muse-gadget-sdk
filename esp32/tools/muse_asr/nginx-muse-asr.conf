# Include inside the site's server block that listens on port 80 (the gadget
# speaks plain HTTP; the audio inside is sealed). Streams the upload through
# unbuffered, so recognition can start as soon as the gadget lets go.
location = /TV/asr {
    proxy_pass http://127.0.0.1:8102/asr;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
    access_log off;
}

# Reply speech: the gadget asks with HTTP/1.0 and reads until the server closes,
# so nginx passes the stream through as it's synthesized, unchunked.
location = /TV/tts {
    proxy_pass http://127.0.0.1:8102/tts;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 4k;
    access_log off;
}
